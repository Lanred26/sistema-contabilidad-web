services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
      MYSQL_DATABASE: ${DB_NAME:-contabilidad}
      MYSQL_USER: ${DB_USER:-contabilidad_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/test-database.sql:/docker-entrypoint-initdb.d/002-test-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
