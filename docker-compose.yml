services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-conta_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      ENABLE_DEV_SEED: ${ENABLE_DEV_SEED:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-contabilidad}
      DB_USER: ${DB_USER:-contabilidad_app}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-locally}
      TEST_DB_NAME: ${TEST_DB_NAME:-contabilidad_test}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
      MYSQL_DATABASE: ${DB_NAME:-contabilidad}
      MYSQL_USER: ${DB_USER:-contabilidad_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/test-database.sql:/docker-entrypoint-initdb.d/002-test-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
